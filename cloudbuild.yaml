steps:

# 1️⃣ Authenticate to cluster
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'auth-cluster'
  entrypoint: gcloud
  args:
    - container
    - clusters
    - get-credentials
    - console-shop-cluster
    - --zone=asia-southeast1-c
    - --project=$PROJECT_ID

# 2️⃣ Update Kubernetes secret (Omise keys removed — now owned by payment-gateway)
- name: 'gcr.io/cloud-builders/kubectl'
  id: 'update-secret'
  entrypoint: bash
  args:
    - -c
    - |
      kubectl create secret generic backend-secret \
        --namespace=console-shop \
        --from-literal=DATABASE_URL="$_DATABASE_URL" \
        --from-literal=JWT_SECRET="$_JWT_SECRET" \
        --from-literal=JWT_REFRESH_SECRET="$_JWT_REFRESH_SECRET" \
        --from-literal=REDIS_HOST="$_REDIS_HOST" \
        --from-literal=REDIS_PORT="$_REDIS_PORT" \
        --from-literal=PORT="$_PORT" \
        --from-literal=JWT_REGISTER_SECRET="$_JWT_REGISTER_SECRET" \
        --from-literal=VONAGE_API_KEY="$_VONAGE_API_KEY" \
        --from-literal=VONAGE_API_SECRET="$_VONAGE_API_SECRET" \
        --from-literal=VONAGE_BRAND="$_VONAGE_BRAND" \
        --from-literal=VONAGE_URL_SEND_OTP="$_VONAGE_URL_SEND_OTP" \
        --from-literal=VONAGE_URL_VERIFY_OTP="$_VONAGE_URL_VERIFY_OTP" \
        --from-literal=WEB_URL="$_WEB_URL" \
        --from-literal=GATEWAY_URL="$_GATEWAY_URL" \
        --dry-run=client -o yaml | kubectl apply -f -
  env:
    - CLOUDSDK_COMPUTE_ZONE=asia-southeast1-c
    - CLOUDSDK_CONTAINER_CLUSTER=console-shop-cluster

# 3️⃣ Build image
- name: 'gcr.io/cloud-builders/docker'
  args:
    - build
    - -t
    - asia-southeast1-docker.pkg.dev/$PROJECT_ID/console-shop/backend:$SHORT_SHA
    - .

# 4️⃣ Push image
- name: 'gcr.io/cloud-builders/docker'
  args:
    - push
    - asia-southeast1-docker.pkg.dev/$PROJECT_ID/console-shop/backend:$SHORT_SHA

# 5️⃣ Deploy new image
- name: 'gcr.io/cloud-builders/kubectl'
  args:
    - set
    - image
    - deployment/console-backend
    - console-backend=asia-southeast1-docker.pkg.dev/$PROJECT_ID/console-shop/backend:$SHORT_SHA
    - --namespace=console-shop
  env:
    - CLOUDSDK_COMPUTE_ZONE=asia-southeast1-c
    - CLOUDSDK_CONTAINER_CLUSTER=console-shop-cluster

images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/console-shop/backend:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
