name: Deploy Backend to GKE

on:
  push:
    branches:
      - dev   # auto-deploy on every push to dev

env:
  REGION: asia-southeast1
  REPO:   console-shop
  IMAGE:  backend
  DEPLOY: console-backend       # k8s Deployment name
  NS:     console-shop          # k8s Namespace

jobs:
  build-and-deploy:
    name: Build, Push & Rollout
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # required for Workload Identity Federation

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout config repo (ecosystem.config.js)
        uses: actions/checkout@v4
        with:
          repository: LBOEVSET/console-shop-backend-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: _config

      - name: Copy ecosystem.config.js into build context
        run: cp _config/ecosystem.config.js ./ecosystem.config.js

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}"
          docker build \
            --platform linux/amd64 \
            -t "${IMAGE_PATH}:latest" \
            -t "${IMAGE_PATH}:${{ github.sha }}" \
            .
          docker push "${IMAGE_PATH}:latest"
          docker push "${IMAGE_PATH}:${{ github.sha }}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location:     ${{ secrets.GKE_ZONE }}
          project_id:   ${{ secrets.GCP_PROJECT_ID }}

      - name: Rollout restart
        run: |
          kubectl rollout restart deployment/${{ env.DEPLOY }} -n ${{ env.NS }}
          kubectl rollout status  deployment/${{ env.DEPLOY }} -n ${{ env.NS }} --timeout=120s
