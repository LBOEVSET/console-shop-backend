name: Deploy Backend to GKE

on:
  push:
    branches: [dev]

env:
  REGION: asia-southeast1
  REPO:   console-shop
  IMAGE:  backend
  DEPLOY: console-backend
  NS:     console-shop

jobs:
  build-and-deploy:
    name: Build, Push & Rollout
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: LBOEVSET/console-shop-backend-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: _config

      - name: Copy ecosystem.config.js into build context
        run: cp _config/ecosystem.config.js ./ecosystem.config.js

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}"
          docker build \
            --platform linux/amd64 \
            -t "${IMAGE_PATH}:latest" \
            -t "${IMAGE_PATH}:${{ github.sha }}" \
            .
          docker push "${IMAGE_PATH}:latest"
          docker push "${IMAGE_PATH}:${{ github.sha }}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location:     ${{ secrets.GKE_ZONE }}
          project_id:   ${{ secrets.GCP_PROJECT_ID }}

      - name: Update k8s secret from config repo
        run: |
          set -a && source _config/environments/dev.env && set +a
          kubectl create secret generic backend-secret \
            --namespace=${{ env.NS }} \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            --from-literal=JWT_REGISTER_SECRET="$JWT_REGISTER_SECRET" \
            --from-literal=REDIS_HOST="$REDIS_HOST" \
            --from-literal=REDIS_PORT="$REDIS_PORT" \
            --from-literal=PORT="$PORT" \
            --from-literal=VONAGE_API_KEY="$VONAGE_API_KEY" \
            --from-literal=VONAGE_API_SECRET="$VONAGE_API_SECRET" \
            --from-literal=VONAGE_BRAND="$VONAGE_BRAND" \
            --from-literal=VONAGE_URL_SEND_OTP="$VONAGE_URL_SEND_OTP" \
            --from-literal=VONAGE_URL_VERIFY_OTP="$VONAGE_URL_VERIFY_OTP" \
            --from-literal=WEB_URL="$WEB_URL" \
            --from-literal=GATEWAY_URL="$GATEWAY_URL" \
            --from-literal=GCS_BUCKET_NAME="$GCS_BUCKET_NAME" \
            --from-literal=ZONE="$ZONE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run database migrations
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}"
          kubectl delete job prisma-migrate -n ${{ env.NS }} --ignore-not-found
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: prisma-migrate
            namespace: ${{ env.NS }}
          spec:
            ttlSecondsAfterFinished: 3600
            backoffLimit: 2
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE_PATH}
                    command: ["sh", "-c", "npx prisma migrate deploy"]
                    envFrom:
                      - secretRef:
                          name: backend-secret
                    env:
                      - name: NODE_ENV
                        value: "production"
          EOF
          kubectl wait job/prisma-migrate -n ${{ env.NS }} --for=condition=complete --timeout=300s

      - name: Deploy
        run: |
          kubectl set image deployment/${{ env.DEPLOY }} \
            ${{ env.DEPLOY }}="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}" \
            -n ${{ env.NS }}
          kubectl rollout status deployment/${{ env.DEPLOY }} -n ${{ env.NS }} --timeout=120s
